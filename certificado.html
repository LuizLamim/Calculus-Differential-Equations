<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Certificado - Blindagem Jurídica na Saúde</title>
  <meta charset="UTF-8">
  <title>Certificado - Blindagem Jurídica na Saúde</title>
  <style>
    /* Configuração do Canvas (1080x720px) */
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Times New Roman', Times, serif;
    }

    .certificate-container {
      width: 1080px;
      height: 720px;
      position: relative;
      background-color: #0b3c26; /* Moldura externa verde-escuro */
      box-sizing: border-box;
      padding: 40px 60px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .certificate-inner {
      width: 960px;
      height: 640px;
      background-color: #f7f4eb; /* Tom pergaminho/creme */
      border: 3px solid #d4af37; /* Linha dourada interna */
      box-sizing: border-box;
      position: relative;
      text-align: center;
    }

    /* Topo: Texto em Arco / Título */
    .title-arc {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #7a5c28;
      text-transform: uppercase;
    }

    /* Brasão Central Superior */
    .emblem {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
    }

    /* Bloco Narrativo Central */
    .text-certificamos {
      position: absolute;
      top: 250px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-style: italic;
      color: #333;
    }

    .tag-student-name {
      position: absolute;
      top: 290px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      font-size: 30px;
      font-weight: bold;
      color: #111;
    }

    .text-concluiu {
      position: absolute;
      top: 345px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-style: italic;
      color: #333;
    }

    .tag-course-name {
      position: absolute;
      top: 385px;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      font-size: 26px;
      font-weight: bold;
      color: #111;
    }

    /* Rodapé: Assinatura (Lado Esquerdo) */
    .signature-block {
      position: absolute;
      top: 470px;
      left: 90px;
      width: 320px;
      text-align: center;
    }

    .signature-img {
      height: 45px;
      margin-bottom: 5px;
    }

    .signature-line {
      border-top: 1px solid #555;
      margin-bottom: 6px;
    }

    .signature-name {
      font-size: 15px;
      font-weight: bold;
      color: #111;
      text-transform: uppercase;
    }

    .signature-role {
      font-size: 12px;
      color: #444;
      line-height: 1.3;
    }

    /* Rodapé: Selo de Autenticidade e Data (Lado Direito) */
    .seal-img {
      position: absolute;
      top: 450px;
      left: 740px;
      width: 120px;
      height: 120px;
    }

    .tag-date {
      position: absolute;
      top: 575px;
      left: 800px;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: bold;
      color: #222;
    }

    /* Rodapé Institucional Fixo (Na Moldura Verde) */
    .footer-brand {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="certificate-container">
    <div class="certificate-inner">
     
      <!-- Cabeçalho -->
      <div class="title-arc">Certificado de Conclusão</div>
      <img src="brasao.png" class="emblem" alt="Brasão">

      <!-- Bloco Narrativo Central -->
      <div class="text-certificamos">Certificamos que</div>
      <div class="tag-student-name">*Nome do estudante*</div>
      <div class="text-concluiu">concluiu com êxito o curso:</div>
      <div class="tag-course-name">*Meu curso*</div>

      <!-- Assinatura -->
      <div class="signature-block">
        <img src="rubrica.png" class="signature-img" alt="Rubrica">
        <div class="signature-line"></div>
        <div class="signature-name">Dra. Isabela Hamú</div>
        <div class="signature-role">
          Ministrante<br>
          Vice-Presidente da Comissão de Direito Médico da OAB/DF
        </div>
      </div>

      <!-- Selo e Data -->
      <img src="selo.png" class="seal-img" alt="Selo de Autenticidade">
      <div class="tag-date">*Data de conclusão*</div>

    </div>

    <!-- Rodapé Fixo -->
    <div class="footer-brand">Blindagem Jurídica na Saúde: Capacitação Premium</div>
  </div>

</body>
